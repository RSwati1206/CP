<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bizGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background soft rounded container -->
  <rect width="32" height="32" rx="8" fill="url(#bizGrad)"/>
  
  <!-- Interconnected Storefront Awning & Connection Nodes -->
  <!-- Awning top silhouette -->
  <path d="M6 12L9 7C9.4 6.4 10.2 6 11 6H21C21.8 6 22.6 6.4 23 7L26 12" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Connection bridge curve -->
  <path d="M10 18C10 14.5 13 13 16 13C19 13 22 14.5 22 18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Left Business Node (Storefront) -->
  <circle cx="10" cy="21" r="3.25" fill="#ffffff"/>
  <circle cx="10" cy="21" r="1.5" fill="#2563eb"/>
  
  <!-- Right Customer Node (Customer / Community with amber accent) -->
  <circle cx="22" cy="21" r="3.25" fill="url(#amberGrad)"/>
  <circle cx="22" cy="21" r="1.5" fill="#ffffff"/>
  
  <!-- Interlinking base arc -->
  <path d="M10 24C12.5 26.5 19.5 26.5 22 24" stroke="url(#amberGrad)" stroke-width="1.75" stroke-linecap="round"/>
  
  <!-- Center Sparkle / Connection Node -->
  <circle cx="16" cy="18" r="1.5" fill="#fbbf24"/>
</svg>
