version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: local_promo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: local_promo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: local_promo_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password123@postgres:5432/local_promo_db
      SECRET_KEY: local_business_secret_key_prod_2026
      JWT_SECRET: local_business_jwt_secret_token_prod_2026
      PORT: 5000
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: local_promo_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
